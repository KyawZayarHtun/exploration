spring:
  application:
    name: exploration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - resilience4j

resilience4j:
  circuitbreaker:
    instances:
      count-base:
        failure-rate-threshold: 60
        sliding-window-type: count_based
        sliding-window-size: 5
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 1
      time-base:
        # If 50% of those calls fail, open the circuit
        failure-rate-threshold: 50
        # Use TIME_BASED sliding window
        sliding-window-type: TIME_BASED
        # The window is 2 seconds long
        sliding-window-size: 2
        # We need at least 3 calls in those 2 seconds to calculate a failure rate
        minimum-number-of-calls: 3
        # After opening, wait 10 seconds before transitioning to HALF_OPEN
        # We use a long time here to show that we can bypass it in the test.
        wait-duration-in-open-state: 10s
        # When in HALF_OPEN, permit 2 test calls
        permitted-number-of-calls-in-half-open-state: 2
      slow-call:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        # Any call over 100s is "slow"
        # Reminder: timelimiter is also working with 1s timeout-duration, so
        # over 1s call will be mark as time out.
        # to change this uncomment and override timeoutDuration from timelimiter
        slow-call-duration-threshold: 100ms
        # If 50% of calls are slow, open the circuit
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
      record-exception:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        # 1. Record ONLY these exceptions
        record-exceptions:
          - java.lang.ArrayIndexOutOfBoundsException
          - java.lang.NullPointerException
        # 2. ALSO record failures based on this custom predicate class
        record-failure-predicate: com.exploration.circuitbreaker.advance.exception.CustomExceptionPredicates.RecordableFailurePredicate
        # 3. ALSO record "successes" as failures based on this predicate
        record-result-predicate: com.exploration.circuitbreaker.advance.exception.CustomExceptionPredicates.RecordableResultPredicate
        wait-duration-in-open-state: 10s


